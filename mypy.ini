[mypy]
# Root package resolution: treat the workspace root as the package root.
# Without this, mypy finds apps/api/app/platform/branding.py twice:
# once as "platform.branding" (bare path) and once as "apps.api.app.platform.branding".
explicit_package_bases = True

# Strict output settings
show_error_codes = True
pretty = True

# Strictness configuration aligned with existing codebase
disallow_untyped_defs = True
disallow_incomplete_defs = True
check_untyped_defs = True
warn_return_any = False
warn_unused_ignores = True
warn_redundant_casts = True
no_implicit_reexport = False

# Per-module overrides for third-party libraries without stubs
[mypy-typer.*]
ignore_missing_imports = True

[mypy-rich.*]
ignore_missing_imports = True

[mypy-jose.*]
ignore_missing_imports = True

[mypy-asyncpg.*]
ignore_missing_imports = True

[mypy-alembic.*]
ignore_missing_imports = True

[mypy-sqlalchemy.*]
ignore_missing_imports = True

[mypy-httpx.*]
ignore_missing_imports = True

[mypy-psycopg.*]
ignore_missing_imports = True
