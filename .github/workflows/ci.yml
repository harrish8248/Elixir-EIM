name: Enterprise CI Pipeline

on:
  push:
    branches: [main, release/*]
  pull_request:
    branches: [main]

jobs:
  backend-lint-and-types:
    name: Backend Lint, Typecheck & Import Boundaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Run Ruff Linter
        run: ruff check .
      - name: Run Ruff Format Check
        run: ruff format --check .
      - name: Enforce Architecture Import Boundaries
        run: lint-imports
      - name: Run Mypy Typecheck
        run: mypy apps/api/app cli

  backend-tests:
    name: Backend Test Suite & Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: elixir
          POSTGRES_PASSWORD: elixir_secure_pass
          POSTGRES_DB: elixir_eim
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        env:
          REDIS_PASSWORD: redis_secure_pass
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: "pip"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Initialize PostgreSQL Roles and Run Alembic Migrations
        env:
          PGPASSWORD: elixir_secure_pass
        run: |
          psql -h localhost -U elixir -d elixir_eim -f deployment/init-db.sql
          alembic -c migrations/alembic.ini upgrade head
      - name: Run Pytest with Coverage and Real Postgres RLS tests
        env:
          DATABASE_URL: postgresql+asyncpg://elixir_app_role:app_secure_pass@localhost:5432/elixir_eim
          DATABASE_URL_SYNC: postgresql://elixir_app_role:app_secure_pass@localhost:5432/elixir_eim
          MIGRATION_DATABASE_URL: postgresql+asyncpg://elixir:elixir_secure_pass@localhost:5432/elixir_eim
          MIGRATION_DATABASE_URL_SYNC: postgresql://elixir:elixir_secure_pass@localhost:5432/elixir_eim
          REQUIRE_POSTGRES: "1"
          REDIS_URL: redis://localhost:6379/0
          ELIXIR_SECRET_KEY: ci-secret-key-entropy-must-be-very-long-32-chars
        run: |
          pytest apps/api/tests --cov=apps/api/app --cov-report=xml --cov-report=term-missing --cov-fail-under=80

  frontend-checks:
    name: Frontend Lint, Typecheck & Vitest
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: apps/web/package-lock.json
      - name: Install Web Dependencies
        working-directory: apps/web
        run: npm ci
      - name: Run Typecheck
        working-directory: apps/web
        run: npm run typecheck
      - name: Run Vitest Unit Tests
        working-directory: apps/web
        run: npm run test:coverage

  security-and-sbom:
    name: Security Vulnerability & SBOM Generation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Install pip-audit & cyclonedx
        run: pip install pip-audit cyclonedx-bom
      - name: Run Dependency Vulnerability Audit
        run: pip-audit
      - name: Generate CycloneDX Software Bill of Materials (SBOM)
        run: cyclonedx-py environment --outfile sbom.json
      - name: Upload SBOM Artifact
        uses: actions/upload-artifact@v4
        with:
          name: elixir-eim-sbom
          path: sbom.json
